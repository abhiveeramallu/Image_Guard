# Render blueprint for the API. Frontend is deployed separately (Vercel).
services:
  - type: web
    name: imageguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: detection artifacts are held in process memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: IMAGEGUARD_ENVIRONMENT
        value: production
      - key: IMAGEGUARD_MAX_IMAGE_PIXELS
        value: "8000000"   # keeps peak memory within a ~512 MB instance (see docs/TESTING.md)
      - key: IMAGEGUARD_WATERMARK_KEY
        sync: false   # secret: set in the dashboard (docs/DEPLOYMENT.md)
      - key: IMAGEGUARD_CORS_ORIGINS
        sync: false   # set to your exact frontend URL, e.g. https://your-app.vercel.app
